# Name of your application. Used to uniquely configure containers.
service: budgetr

# Name of the container image.
image: nurey/budgetr

# Deploy to these servers.
servers:
  web:
    hosts:
      - 38.49.217.106

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  # server: registry.digitalocean.com / ghcr.io / ...
  username: ilia@nurey.com

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    DB_HOST: budgetr-db
    POSTGRES_USER: budgetr_app
    POSTGRES_DB: banking_production
    CORS_ORIGINS: https://budgetr-app.nurey.com
    WEB_CONCURRENCY: "auto"
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD

# Use a different ssh user than root
ssh:
  user: ilia

# Configure builder setup.
builder:
  arch: amd64
#remote: ssh://ilia@168.235.69.227
  local: true

# Use accessory services (secrets come from .env).
accessories:
  db:
    image: postgres:18
    host: 38.49.217.106
    env:
      clear:
        POSTGRES_USER: 'budgetr_app'
        POSTGRES_DB: 'banking_production'
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql

# Configure Kamal Proxy
proxy:
  ssl: true
  host: budgetr.nurey.com
  app_port: 3000
  # Base deploy.yml pins bind_ips to the optiplex LAN IP (tailscaled workaround);
  # the production host has no such conflict, so bind on all interfaces.
  run:
    bind_ips: ["0.0.0.0"]
